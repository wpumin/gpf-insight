<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GPF Insight" />
    
    <title>GPF Insight</title>
    
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <style>
      /* Native-like Splash Screen */
      #pwa-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #020617; /* Slate-950 matched to dark mode */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #pwa-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #pwa-splash img {
        width: 120px;
        height: 120px;
        border-radius: 28px; /* Apple-style squircle ratio */
        box-shadow: 0 16px 32px -8px rgba(5, 150, 105, 0.3);
        margin-bottom: 24px;
        animation: splashPulse 2s infinite ease-in-out;
      }
      #pwa-splash h1 {
        color: #ffffff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 0;
      }

      /* Seamless light mode matching */
      @media (prefers-color-scheme: light) {
        #pwa-splash { background-color: #f8fafc; }
        #pwa-splash h1 { color: #0f172a; }
        #pwa-splash img { box-shadow: 0 16px 32px -8px rgba(5, 150, 105, 0.2); }
      }

      @keyframes splashPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash">
      <img src="/icon.svg" alt="GPF Insight app icon" />
      <h1>GPF Insight</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
        });
      }
    </script>
  </body>
</html>
