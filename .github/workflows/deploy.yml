name: Deploy Frontend
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          echo "Current Node version: $(node -v)"
          echo "Current NPM version: $(npm -v)"
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci --legacy-peer-deps
          else
            echo "package-lock.json not found. Running npm install..."
            npm install --legacy-peer-deps
          fi
        
      - name: Build
        env:
          NODE_ENV: production
          VITE_BASE: /
        run: |
          echo "Starting build process..."
          npm run build
        
      - name: Setup for Pages
        run: |
          echo "Preparing dist directory..."
          mkdir -p ./dist
          touch ./dist/.nojekyll
          if [ -f "public/CNAME" ]; then
            cp public/CNAME dist/CNAME
          elif [ ! -f "dist/CNAME" ]; then
             echo "gpf-in.site" > dist/CNAME
          fi
          echo "CNAME content: $(cat dist/CNAME || echo 'No CNAME')"
          
      - name: Verify build output
        run: |
          echo "Checking dist directory structure..."
          if [ -d "dist" ]; then
            echo "dist directory exists."
            if [ -f "dist/index.html" ]; then
              echo "index.html found in dist."
            else
              echo "::error::index.html NOT found in dist!"
              ls -la dist
              exit 1
            fi
            ls -R dist
          else
            echo "::error::dist directory NOT found!"
            ls -la .
            exit 1
          fi
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
